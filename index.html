<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>✨ 뽀짝 요정의 별빛 방탈출 ✨</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: white; font-family: 'Malgun Gothic', sans-serif; user-select: none; }
        canvas { display: block; }
        
        #ui { position: absolute; top: 25px; left: 25px; font-size: 22px; font-weight: bold; z-index: 10; display: none; text-shadow: 2px 2px 5px rgba(0,0,0,0.9); transition: 0.1s; }
        
        #staminaContainer { width: 220px; height: 16px; border: 2px solid #333; margin-top: 10px; background: rgba(0,0,0,0.8); border-radius: 4px; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
        #staminaBar { width: 100%; height: 100%; background: linear-gradient(90deg, #008800, #00ff00); transition: 0.1s; }
        
        #batteryContainer { width: 220px; height: 12px; border: 2px solid #333; margin-top: 6px; background: rgba(0,0,0,0.8); border-radius: 4px; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
        #batteryBar { width: 100%; height: 100%; background: linear-gradient(90deg, #aa8800, #ffd700); transition: 0.1s; }
        
        #flashlightStatus { margin-top: 8px; font-size: 17px; color: #888; text-shadow: 1px 1px 3px black; }
        .flash-on { color: #ffd700 !important; text-shadow: 0 0 8px rgba(255,215,0,0.7) !important; }
        #powerTimerContainer { display: none; margin-top: 15px; font-size: 21px; color: #00ffcc; text-shadow: 0 0 12px #00ffcc, 1px 1px 2px black; font-weight: 900; }

        #interactionMsg { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: bold; color: white; text-shadow: 0 0 15px #000, 0 0 5px #000; display: none; z-index: 10; width: 100%; text-align: center; }
        #alertMsg { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: bold; color: #ff3333; text-shadow: 0 0 25px #ff0000, 2px 2px 5px black; display: none; z-index: 10; width: 100%; text-align: center;}
        #bloodWarning { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 45px; font-weight: bold; color: #ff0000; text-shadow: 0 0 30px darkred, 0 0 15px black; display: none; z-index: 5; opacity: 0.8; pointer-events: none; }

        .film-grain { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 85; opacity: 0.2; display: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
        #vhsFilter { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: repeating-linear-gradient(rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 4px); pointer-events: none; z-index: 90; display: none; opacity: 0.5; }
        
        .chromatic-aberration { text-shadow: -3px 0 0 red, 3px 0 0 blue !important; animation: shake 0.15s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 50% { transform: translate(-2px, -2px) rotate(-1deg); } 100% { transform: translate(-3px, 0px) rotate(1deg); } }
        .flash-red { animation: flash 0.05s infinite alternate; }
        @keyframes flash { 0% { filter: invert(0) sepia(0); } 100% { filter: invert(1) sepia(1) hue-rotate(180deg) saturate(5); } }

        .cute-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); z-index: 20; text-align: center; color: #d9488f; }
        .cute-overlay h1 { font-size: 60px; margin-bottom: 15px; text-shadow: 2px 2px 0px #fff; }
        .cute-overlay p { font-size: 22px; font-weight: bold; color: #b53877; text-shadow: 1px 1px 0px #fff; margin: 8px 0;}
        .cute-overlay button { padding: 15px 40px; font-size: 24px; font-weight: bold; cursor: pointer; background: #ff758c; color: #fff; border: none; border-radius: 30px; margin-top: 35px; transition: 0.3s; box-shadow: 0 8px 20px rgba(255,100,100,0.5); }
        .cute-overlay button:hover { background: #ff5e78; transform: translateY(-3px) scale(1.05); }

        #initScreen { z-index: 30; cursor: pointer; }
        #initScreen:hover p { transform: scale(1.1); transition: 0.3s; }

        .horror-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.95); z-index: 20; text-align: center; color: white; }
        .horror-overlay button { padding: 15px 45px; font-size: 24px; font-weight: bold; cursor: pointer; background: #222; color: #fff; border: 2px solid #777; border-radius: 4px; margin-top: 30px; transition: 0.2s; }
        .horror-overlay button:hover { background: #880000; border-color: #ff0000; box-shadow: 0 0 20px rgba(255,0,0,0.8); }

        #jumpscareOverlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: none; justify-content: center; align-items: center; z-index: 99; overflow: hidden; }
        #jumpscareImg { width: 100vw; height: 100vh; object-fit: contain; filter: contrast(1.5) brightness(1.2); }
        
        #miniScareOverlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; justify-content: center; align-items: center; z-index: 95; pointer-events: none; background: rgba(0, 0, 0, 0.7); overflow: hidden; }
        #miniScareOverlay img { width: 100vw; height: 100vh; object-fit: cover; animation: insaneJumpscare 0.15s infinite alternate; opacity: 0.95;}
        @keyframes insaneJumpscare { 0% { transform: scale(1.5) translate(15px, 15px); filter: invert(1) contrast(1.8) brightness(1.3); } 100% { transform: scale(2.0) translate(-20px, 5px); filter: invert(0) contrast(2) brightness(1.1); } }
    </style>
</head>
<body>
    <div class="film-grain" id="filmGrain"></div><div id="vhsFilter"></div>
    
    <div id="ui">
        <div><span id="itemName">✨ 별 조각</span>: <span id="keyCount" style="color:#FFD700;">0</span> / 5</div>
        <div id="staminaContainer"><div id="staminaBar"></div></div>
        <div id="batteryContainer"><div id="batteryBar"></div></div>
        <div id="flashlightStatus" class="flash-on">[F] 손전등: ON</div>
        <div id="powerTimerContainer">⚡ 전력 복구: <span id="powerSec">10.0</span>초</div>
    </div>
    
    <div id="interactionMsg"></div><div id="alertMsg">그것이 깨어났습니다...</div><div id="bloodWarning">발이 묶였습니다! (이속 감소)</div>
    <canvas id="gameCanvas"></canvas>
    
    <div id="jumpscareOverlay"><img id="jumpscareImg" src="monster.png" alt="Jumpscare"></div>
    <div id="miniScareOverlay"><img src="scare.png" alt="Ghost2"></div>

    <div id="initScreen" class="cute-overlay"><h1>환영합니다!</h1><p style="font-size: 25px;">화면을 아무 곳이나 클릭해서 입장해주세요 💖</p></div>
    <div id="startScreen" class="cute-overlay" style="display: none;">
        <h1>✨ 뽀짝 요정의 별빛 방탈출 ✨</h1>
        <p>복잡한 미로와 닫힌 방들 사이에서 잃어버린 별 조각 5개를 찾아주세요!</p>
        <p style="color:#444; font-size:18px; margin-top:15px;">W,A,S,D (이동) | Shift (총총 뛰기 💖) | F (손전등) | E (상호작용)</p>
        <button id="startBtn">미로탈출 시작 💖</button>
    </div>
    <div id="endScreen" class="horror-overlay"><h1 id="endMessage" style="font-size: 55px; color: #ff3333; text-shadow: 0 0 20px red;"></h1><button onclick="location.reload()">다시 도전</button></div>

<script>
    // ==========================================
    // 1. 오디오 및 시스템
    // ==========================================
    const monsterImg = new Image(); monsterImg.src = "monster.png";
    const ghost2Img = new Image();  ghost2Img.src = "scare.png"; 

    const track1 = new Audio('track1.mp3'); track1.loop = true; track1.volume = 0.5;
    const track2 = new Audio('track2.mp3'); track2.loop = true; track2.volume = 0.6; 
    const sound1 = new Audio('sound1.mp3'); sound1.volume = 1.0; 
    const sound2 = new Audio('sound2.mp3'); sound2.volume = 0.9; 
    const genAudio = new Audio('power.mp3'); genAudio.volume = 1.0;

    let audioCtx, droneOsc, droneGain;
    let sound2Timeout, genSoundTimeout, deathSoundTimeout; 

    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }

    function playRealisticFlashlightSound() {
        if (!audioCtx) return; let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'square'; osc.frequency.setValueAtTime(1200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.03);
        
        let noise = audioCtx.createBufferSource(), buffer = audioCtx.createBuffer(1, audioCtx.sampleRate*0.02, audioCtx.sampleRate), data = buffer.getChannelData(0);
        for(let i=0; i<buffer.length; i++) data[i] = Math.random()*2-1;
        noise.buffer = buffer; let nGain = audioCtx.createGain(); nGain.gain.setValueAtTime(0.3, audioCtx.currentTime); nGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.02);
        noise.connect(nGain); nGain.connect(audioCtx.destination); noise.start();
    }

    function playKeySound() {
        if(!audioCtx) return;
        [2000, 2500, 3200].forEach((freq, i) => {
            let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'triangle'; osc.frequency.value = freq + Math.random()*100;
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime + i*0.04); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i*0.04 + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(audioCtx.currentTime + i*0.04); osc.stop(audioCtx.currentTime + i*0.04 + 0.3);
        });
    }

    function playBatterySound() {
        if(!audioCtx) return; let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }

    function playDashSound() {
        if (!audioCtx) return; let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.6, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }

    function playGlassSound() {
        if (!audioCtx) return; let noise = audioCtx.createBufferSource(), buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate), data = buffer.getChannelData(0);
        for (let i = 0; i < buffer.length; i++) data[i] = Math.random() * 2 - 1;
        noise.buffer = buffer; let filter = audioCtx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 5000;
        let gain = audioCtx.createGain(); gain.gain.setValueAtTime(1.0, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start();
    }

    function startAmbientDrone() {
        if (!audioCtx) return; droneOsc = audioCtx.createOscillator(); droneGain = audioCtx.createGain();
        droneOsc.type = 'sine'; droneOsc.frequency.value = 45; 
        let lfo = audioCtx.createOscillator(), lfoGain = audioCtx.createGain();
        lfo.type = 'sine'; lfo.frequency.value = 0.15; lfoGain.gain.value = 10;
        lfo.connect(lfoGain); lfoGain.connect(droneOsc.frequency); lfo.start();
        droneGain.gain.setValueAtTime(0, audioCtx.currentTime); droneGain.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 3); 
        droneOsc.connect(droneGain); droneGain.connect(audioCtx.destination); droneOsc.start();
    }

    const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
    const maskCanvas = document.createElement('canvas'), maskCtx = maskCanvas.getContext('2d');
    const ui = {
        main: document.getElementById('ui'), start: document.getElementById('startScreen'), end: document.getElementById('endScreen'), msg: document.getElementById('endMessage'),
        key: document.getElementById('keyCount'), stamina: document.getElementById('staminaBar'), battery: document.getElementById('batteryBar'),
        flashStatus: document.getElementById('flashlightStatus'), interact: document.getElementById('interactionMsg'), alert: document.getElementById('alertMsg'),
        bloodWar: document.getElementById('bloodWarning'), itemName: document.getElementById('itemName'), vhs: document.getElementById('vhsFilter'), grain: document.getElementById('filmGrain'),
        powerContainer: document.getElementById('powerTimerContainer'), powerSec: document.getElementById('powerSec')
    };

    const preBloodCanvas = document.createElement('canvas'); preBloodCanvas.width = 200; preBloodCanvas.height = 200; const pbCtx = preBloodCanvas.getContext('2d');
    let bgGrad = pbCtx.createRadialGradient(100,100,0, 100,100,100); bgGrad.addColorStop(0, 'rgba(50,0,0,0.95)'); bgGrad.addColorStop(1, 'rgba(20,0,0,0)');
    pbCtx.fillStyle = bgGrad; pbCtx.beginPath(); pbCtx.arc(100,100,100,0,Math.PI*2); pbCtx.fill();
    pbCtx.fillStyle = 'rgba(60,5,5,0.75)'; for(let i=0; i<12; i++) { pbCtx.beginPath(); pbCtx.arc(100+(Math.random()-0.5)*150, 100+(Math.random()-0.5)*150, Math.random()*20+10, 0, Math.PI*2); pbCtx.fill(); }
    pbCtx.fillStyle = 'rgba(120, 20, 20, 0.4)'; pbCtx.beginPath(); pbCtx.arc(80, 80, 40, 0, Math.PI*2); pbCtx.fill();

    const preDragCanvas = document.createElement('canvas'); preDragCanvas.width = 200; preDragCanvas.height = 40; const pdCtx = preDragCanvas.getContext('2d');
    let dgGrad = pdCtx.createLinearGradient(0,20, 200,20); dgGrad.addColorStop(0, 'rgba(70, 5, 5, 0.9)'); dgGrad.addColorStop(1, 'rgba(40, 0, 0, 0)');
    pdCtx.fillStyle = dgGrad; pdCtx.fillRect(0,0,200,40);

    const wallPatternCanvas = document.createElement('canvas'); wallPatternCanvas.width = 256; wallPatternCanvas.height = 256; const wpCtx = wallPatternCanvas.getContext('2d');
    wpCtx.fillStyle = '#110a0a'; wpCtx.fillRect(0,0,256,256);
    for(let i=0; i<1500; i++) {
        let rand = Math.random();
        if(rand > 0.7) wpCtx.fillStyle = `rgba(0,0,0,${Math.random()*0.9})`; else if(rand > 0.4) wpCtx.fillStyle = `rgba(40,5,5,${Math.random()*0.6})`; else wpCtx.fillStyle = `rgba(255,255,255,${Math.random()*0.02})`; 
        wpCtx.fillRect(Math.random()*256, Math.random()*256, Math.random()*40+5, Math.random()*10+1); 
    }
    let wallPattern = null;

    function resize() { canvas.width = maskCanvas.width = window.innerWidth; canvas.height = maskCanvas.height = window.innerHeight; if(!wallPattern) wallPattern = ctx.createPattern(wallPatternCanvas, 'repeat'); }
    window.addEventListener('resize', resize); resize();

    // ==========================================
    // 2. 게임 상태 및 데이터
    // ==========================================
    let gameActive = false, gamePhase = 'CUTE';
    let timers = { cute: 0, transition: 0, lightning: 400, mindEye: 0, navUpdate: 0 };
    let effects = { lightning: 0, redVignette: 0, camShake: 0 };
    let keysCollected = 0; const maxKeys = 5; let frameCount = 0;
    let isShrineCooldown = false, keyRevealTimer = 0, dashTimer = 0, dashDir = {x: 0, y: 0}, globalPowerTimer = 0;

    const input = { w: false, a: false, s: false, d: false, shift: false, ePressed: false, fPressed: false };
    let mouse = { x: canvas.width/2, y: canvas.height/2 }, heavyMouse = { x: canvas.width/2, y: canvas.height/2 }; 
    let cam = { x: 0, y: 0 }, headBob = 0, bobY = 0;

    const player = { x: 450, y: 450, radius: 12, speed: 4.0, stamina: 100, battery: 100, isLightOn: true };
    const monster = { x: -1000, y: -1000, size: 40, baseSpeed: 4.5, state: 'WANDER', targetX: -1000, targetY: -1000, enrage: 0, pathTargetX: undefined, pathTargetY: undefined, giveUpTimer: 0 }; 
    const ghost2 = { active: false, timer: 0 }; 
    let escapeGate = { x: -1000, y: -1000, radius: 45, active: false }; 
    let activeInteractable = null;

    const dustParticles = Array.from({length: 150}, () => ({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, size: Math.random() * 1.5 + 0.5, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3 }));

    // ==========================================
    // 3. 다채롭고 이동 편한 맵 제네레이터
    // ==========================================
    const CELL = 300; const WORLD_W = 4500; const WORLD_H = 4500; 
    const env = { walls: [], doors: [], shrines: [], generators: [], bloods: [], decals: [], items: [], batteries: [], roomAreas: [], shards: [], candles: [] };
    const GRID_SIZE = 100; const COLS = 45; const ROWS = 45; 
    let navGrid = Array.from({length: ROWS}, () => Array(COLS).fill(0));

    env.walls.push({x:0, y:0, w:WORLD_W, h:40}); env.walls.push({x:0, y:WORLD_H-40, w:WORLD_W, h:40});
    env.walls.push({x:0, y:0, w:40, h:WORLD_H}); env.walls.push({x:WORLD_W-40, y:0, w:40, h:WORLD_H});

    const grid = Array.from({length: 15}, () => Array(15).fill('EMPTY'));
    for(let r=0; r<4; r++) for(let c=0; c<4; c++) grid[r][c] = 'SAFE'; 

    let roomsData = [];
    for(let attempt = 0; attempt < 150; attempt++) {
        let rw = Math.random() > 0.6 ? 2 : 1; let rh = Math.random() > 0.6 ? 2 : 1;
        let r = Math.floor(Math.random() * (15 - rh)); let c = Math.floor(Math.random() * (15 - rw));
        let canPlace = true;
        for(let rr = r-1; rr <= r+rh; rr++) {
            for(let cc = c-1; cc <= c+rw; cc++) { if(rr>=0 && rr<15 && cc>=0 && cc<15) { if(grid[rr][cc] !== 'EMPTY') { canPlace = false; break; } } }
            if(!canPlace) break;
        }
        if(canPlace) {
            for(let rr = r; rr < r+rh; rr++) { for(let cc = c; cc < c+rw; cc++) grid[rr][cc] = 'ROOM'; }
            roomsData.push({r, c, rw, rh});
        }
    }

    function addWallWithDoor(wx, wy, ww, wh, isVert, hasDoor) {
        if(!hasDoor) { env.walls.push({x:wx, y:wy, w:ww, h:wh}); return; }
        let doorSize = 140; 
        if(isVert) { 
            let doorY = wy + (wh/2) - (doorSize/2); 
            env.walls.push({x:wx, y:wy, w:ww, h: doorY - wy});
            env.doors.push({x:wx, y:doorY, origX:wx, origY:doorY, w:ww, h:doorSize, isVert:true, state:'closed', maxOpen:doorSize, openVal:0});
            env.walls.push({x:wx, y:doorY+doorSize, w:ww, h: (wy+wh) - (doorY+doorSize)});
        } else { 
            let doorX = wx + (ww/2) - (doorSize/2);
            env.walls.push({x:wx, y:wy, w: doorX - wx, h:wh});
            env.doors.push({x:doorX, y:wy, origX:doorX, origY:wy, w:doorSize, h:wh, isVert:false, state:'closed', maxOpen:doorSize, openVal:0});
            env.walls.push({x:doorX+doorSize, y:wy, w: (wx+ww) - (doorX+doorSize), h:wh});
        }
    }

    roomsData.forEach(rm => {
        let px = rm.c * CELL, py = rm.r * CELL; let rw_px = rm.rw * CELL, rh_px = rm.rh * CELL, th = 40;
        env.roomAreas.push({x: px+th, y: py+th, w: rw_px-th*2, h: rh_px-th*2});
        let edges = ['top', 'bottom', 'left', 'right'].sort(() => Math.random() - 0.5); let doorCount = (rm.rw * rm.rh > 1) ? 2 : 1; 
        addWallWithDoor(px, py, rw_px, th, false, edges.includes('top') && doorCount-- > 0); 
        addWallWithDoor(px, py+rh_px-th, rw_px, th, false, edges.includes('bottom') && doorCount-- > 0); 
        addWallWithDoor(px, py+th, th, rh_px-th*2, true, edges.includes('left') && doorCount-- > 0); 
        addWallWithDoor(px+rw_px-th, py+th, th, rh_px-th*2, true, edges.includes('right') && doorCount-- > 0); 
        
        if (rm.rw === 2 && rm.rh === 2) { env.walls.push({x: px + CELL - 40, y: py + CELL - 40, w: 80, h: 80}); } 
        else if (rm.rw === 2 && rm.rh === 1) { env.walls.push({x: px + CELL - 40, y: py + (CELL/2) - 40, w: 80, h: 80}); } 
        else if (rm.rw === 1 && rm.rh === 2) { env.walls.push({x: px + (CELL/2) - 40, y: py + CELL - 40, w: 80, h: 80}); }
    });

    let mazeWalls = [];
    for(let r=0; r<15; r++) {
        for(let c=0; c<15; c++) {
            if (grid[r][c] === 'EMPTY' && Math.random() > 0.5) {
                let px = c * CELL + 100, py = r * CELL + 100; 
                if (Math.random() > 0.5) {
                    mazeWalls.push({x: px, y: py, w: 100, h: 100}); 
                } else {
                    mazeWalls.push({x: px, y: py, w: 150, h: 50}); 
                    mazeWalls.push({x: px, y: py, w: 50, h: 150}); 
                }
            }
        }
    }
    env.walls.push(...mazeWalls.filter(w => {

            if (monster.enrage > 0) { mSpd *= 1.8; monster.enrage--; } 
            else if (player.isLightOn && player.battery > 0 && getDist(monster, {x:wx, y:wy}) < 250) { mSpd *= 0.3; } 
            
            if (monster.giveUpTimer > 0) { monster.giveUpTimer--; monster.state = 'WANDER'; } 
            else { if (mDist < dRange) monster.state = 'CHASE'; else if (mDist > dRange*1.8 && monster.enrage <= 0) { monster.state = 'WANDER'; monster.targetX = player.x; monster.targetY = player.y; } }
            
            timers.navUpdate--;
            if(timers.navUpdate <= 0) {
                let targetPos = (monster.state === 'CHASE' || monster.enrage > 0) ? player : {x: monster.targetX, y: monster.targetY};
                let nextNode = getNextPathNode(monster.x, monster.y, targetPos.x, targetPos.y);
                if(nextNode) { monster.pathTargetX = nextNode.x; monster.pathTargetY = nextNode.y; }
                else { monster.pathTargetX = undefined; monster.pathTargetY = undefined; if(monster.state === 'CHASE' || monster.enrage > 0) { monster.state = 'WANDER'; monster.giveUpTimer = 150; monster.targetX = monster.x + (Math.random() > 0.5 ? 1200 : -1200); monster.targetY = monster.y + (Math.random() > 0.5 ? 1200 : -1200); } } 
                timers.navUpdate = 10;
            }

            if (monster.state === 'WANDER' && getDist(monster, {x: monster.targetX, y: monster.targetY}) < 30) { monster.targetX = player.x+(Math.random()*1500-750); monster.targetY = player.y+(Math.random()*1500-750); }
            if (monster.pathTargetX !== undefined && monster.pathTargetY !== undefined) { let a = Math.atan2(monster.pathTargetY - monster.y, monster.pathTargetX - monster.x); monster.x += Math.cos(a)*(monster.state==='CHASE'?mSpd:mSpd*0.6); monster.y += Math.sin(a)*(monster.state==='CHASE'?mSpd:mSpd*0.6); }

            env.walls.forEach(w => collide(monster, w)); env.doors.forEach(d => { if(d.state !== 'open') collide(monster, d); }); env.generators.forEach(g => collide(monster, g));

            if (ghost2.active) {
                ghost2.timer--;
                if (ghost2.timer <= 0) {
                    document.getElementById('miniScareOverlay').style.display = 'flex'; setTimeout(() => document.getElementById('miniScareOverlay').style.display = 'none', 400); 
                    player.stamina = 0; player.battery = Math.max(0, player.battery - 25); effects.redVignette = 0.6; effects.camShake = 20;
                    sound2.currentTime = 0; sound2.play().catch(()=>{}); clearTimeout(sound2Timeout); sound2Timeout = setTimeout(() => { sound2.pause(); sound2.currentTime=0; }, 3000); ghost2.timer = Math.random()*2500+2500; 
                }
            }

            let tRed = (mDist < 700) ? (1-(mDist/700))*0.4 + (monster.state==='CHASE'?Math.sin(frameCount*0.2)*0.05:0) + (monster.enrage>0?0.15:0) : 0;
            effects.redVignette += (effects.redVignette > tRed) ? -0.015 : (tRed - effects.redVignette);

            if (mDist < player.radius + monster.size) { 
                gameActive = false; 
                track2.pause(); 
                if(droneOsc) { try { droneOsc.stop(); } catch(e){} }
                
                clearTimeout(genSoundTimeout);
                genAudio.pause(); 
                
                sound1.currentTime = 0; 
                sound1.play().catch(()=>{}); 
                
                clearTimeout(deathSoundTimeout); 
                deathSoundTimeout = setTimeout(() => { sound1.pause(); }, 5000);
                
                document.getElementById('jumpscareOverlay').style.display = 'flex'; 
                document.getElementById('jumpscareOverlay').classList.add('flash-red');
                
                setTimeout(() => { 
                    document.getElementById('jumpscareOverlay').style.display='none'; 
                    document.getElementById('jumpscareOverlay').classList.remove('flash-red'); 
                    ui.msg.innerText="잡혔습니다..."; 
                    ui.msg.style.color="#ff3333"; 
                    ui.end.style.display='flex'; 
                    ui.vhs.style.display='none'; 
                    ui.grain.style.display='none'; 
                }, 1500); 
            }
            
            if (keysCollected >= maxKeys && getDist(player, escapeGate) < player.radius + escapeGate.radius) {
                gameActive = false; track2.pause(); if(droneOsc) { try { droneOsc.stop(); } catch(e){} } 
                ui.msg.innerText="미로와 방을 모두 무사히 탈출했습니다!"; ui.msg.style.color="#55ff55"; ui.end.style.display='flex'; ui.vhs.style.display='none'; ui.grain.style.display='none';
            }
        }
    }

    // ==========================================
    // 6. 렌더링
    // ==========================================
    function draw3DWall(w, cx, cy, type='wall', pass='all') {
        let scale = type === 'gen' ? 0.12 : 0.25; 
        let bx1 = w.x, by1 = w.y, bx2 = w.x+w.w, by2 = w.y+w.h;
        if(type==='door' && w.state==='open') return; 
        let tx1 = bx1 + (bx1-cx)*scale, ty1 = by1 + (by1-cy)*scale, tx2 = bx2 + (bx2-cx)*scale, ty2 = by2 + (by2-cy)*scale;
        let wallFillSide1, wallFillSide2, wallFillTop;

        if (gamePhase === 'CUTE') { wallFillSide1 = type==='door' ? '#ff85a1' : (type==='gen'?'#888':'#ffb6c1'); wallFillSide2 = type==='door' ? '#ff6b8b' : (type==='gen'?'#666':'#ff99a8'); wallFillTop = type==='door' ? '#ff477e' : (type==='gen'?'#999':'#ff8096'); } 
        else {
            let sideC1 = type==='door' ? '#422415' : (type==='gen'?'#112222':'#181010'); let sideC2 = type==='door' ? '#331a0d' : (type==='gen'?'#0a1515':'#120808'); let topC = type==='door' ? '#542d18' : (type==='gen'?'#1a3333':'#080404');
            wallFillSide1 = type==='wall' ? wallPattern : sideC1; wallFillSide2 = type==='wall' ? wallPattern : sideC2; wallFillTop = type==='wall' ? wallPattern : topC;
        }

        if (pass === 'all' || pass === 'side') {
            if (cx < bx1) { ctx.fillStyle = wallFillSide1; ctx.beginPath(); ctx.moveTo(bx1, by1); ctx.lineTo(tx1, ty1); ctx.lineTo(tx1, ty2); ctx.lineTo(bx1, by2); ctx.fill(); } 
            else if (cx > bx2) { ctx.fillStyle = wallFillSide1; ctx.beginPath(); ctx.moveTo(bx2, by1); ctx.lineTo(tx2, ty1); ctx.lineTo(tx2, ty2); ctx.lineTo(bx2, by2); ctx.fill(); }
            if (cy < by1) { ctx.fillStyle = wallFillSide2; ctx.beginPath(); ctx.moveTo(bx1, by1); ctx.lineTo(tx1, ty1); ctx.lineTo(tx2, ty1); ctx.lineTo(bx2, by1); ctx.fill(); } 
            else if (cy > by2) { ctx.fillStyle = wallFillSide2; ctx.beginPath(); ctx.moveTo(bx1, by2); ctx.lineTo(tx1, ty2); ctx.lineTo(tx2, ty2); ctx.lineTo(bx2, by2); ctx.fill(); }
        }
        
        if (pass === 'all' || pass === 'top') {
            ctx.fillStyle = wallFillTop; ctx.fillRect(Math.min(tx1,tx2), Math.min(ty1,ty2), Math.abs(tx2-tx1), Math.abs(ty2-ty1));
            if (type==='wall') { ctx.strokeStyle = gamePhase === 'CUTE' ? '#ff99b3' : 'rgba(0,0,0,0.8)'; ctx.lineWidth = 1.5; ctx.strokeRect(Math.min(tx1,tx2), Math.min(ty1,ty2), Math.abs(tx2-tx1), Math.abs(ty2-ty1)); }
            if (type==='gen') { ctx.fillStyle = w.used ? '#333' : (Math.sin(frameCount*0.1)>0 ? '#0f0' : '#080'); ctx.beginPath(); ctx.arc(Math.min(tx1,tx2) + 20, Math.min(ty1,ty2) + 20, 5, 0, Math.PI*2); ctx.fill(); }
        }
    }

    function draw() {
        let viewMargin = 150; let viewRect = { x: cam.x - viewMargin, y: cam.y - viewMargin, w: canvas.width + viewMargin*2, h: canvas.height + viewMargin*2 };

        const inView = (obj) => {
            let ox = obj.x !== undefined ? obj.x : obj.origX; let oy = obj.y !== undefined ? obj.y : obj.origY;
            let ow = obj.w || (obj.radius ? obj.radius*2 : (obj.size ? obj.size*2 : 50)); let oh = obj.h || (obj.radius ? obj.radius*2 : (obj.size ? obj.size*2 : 50));
            if (obj.radius || obj.size || obj.splats) { ox -= ow/2; oy -= oh/2; }
            return !(ox > viewRect.x + viewRect.w || ox + ow < viewRect.x || oy > viewRect.y + viewRect.h || oy + oh < viewRect.y);
        };

        let visibleWalls = env.walls.filter(inView); let visibleDoors = env.doors.filter(inView); let visibleGens = env.generators.filter(inView);
        let visibleRooms = env.roomAreas.filter(inView); let visibleBloods = env.bloods.filter(inView); let visibleShards = env.shards.filter(inView);
        let visibleDecals = env.decals.filter(inView); let visibleShrines = env.shrines.filter(inView);
        let visibleItems = env.items.filter(inView); let visibleBatteries = env.batteries.filter(inView); let visibleCandles = env.candles.filter(inView);

        ctx.save(); 
        let sx = (Math.random()-0.5)*effects.camShake, sy = (Math.random()-0.5)*effects.camShake;
        ctx.translate(-cam.x + sx, -cam.y + bobY + sy);
        let screenCX = cam.x + canvas.width/2, screenCY = cam.y + canvas.height/2;

        if (gamePhase === 'CUTE') {
            ctx.fillStyle = '#fff0f5'; ctx.fillRect(viewRect.x, viewRect.y, viewRect.w, viewRect.h);
            visibleRooms.forEach(r => { ctx.fillStyle = '#ffe4e1'; ctx.fillRect(r.x, r.y, r.w, r.h); });
            visibleBloods.forEach(bp => { ctx.save(); ctx.translate(bp.x, bp.y); ctx.scale(bp.radius/100, bp.radius/100); ctx.rotate(bp.rot); ctx.globalAlpha = 0.5; ctx.fillStyle = '#ffb6c1'; ctx.beginPath(); ctx.arc(0,0,100,0,Math.PI*2); ctx.fill(); ctx.restore(); });
            ctx.textAlign = "center"; ctx.textBaseline = "middle"; 
            visibleDecals.forEach(d => { ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.angle); if (d.isEmoji) { ctx.font="30px Arial"; ctx.fillText("🌸",0,0); } else { ctx.font="bold 24px 'Malgun Gothic'"; ctx.fillStyle="rgba(255,105,180,0.7)"; ctx.fillText(d.cText,0,0); } ctx.restore(); });
            visibleWalls.forEach(w => draw3DWall(w, screenCX, screenCY, 'wall')); visibleDoors.forEach(d => { if(d.state!=='open') draw3DWall(d, screenCX, screenCY, 'door'); }); visibleGens.forEach(g => draw3DWall(g, screenCX, screenCY, 'gen'));
            ctx.fillStyle = '#ff99c2'; visibleShrines.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, 20, 0, Math.PI*2); ctx.fill(); }); if(inView(escapeGate)) { ctx.fillStyle = 'rgba(255,182,193,0.6)'; ctx.beginPath(); ctx.arc(escapeGate.x, escapeGate.y, escapeGate.radius, 0, Math.PI*2); ctx.fill(); }
            ctx.fillStyle = '#FFD700'; visibleItems.forEach(i => { ctx.save(); ctx.translate(i.x, i.y); ctx.rotate(Math.PI/4); ctx.beginPath(); ctx.arc(-6, 0, 6, 0, Math.PI*2); ctx.fill(); ctx.fillRect(-1, -2, 12, 4); ctx.fillRect(7, 2, 4, 4); ctx.fillRect(3, 2, 3, 3); ctx.restore(); });
            ctx.fillStyle = '#ff6b81'; ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fill(); 
        } 
        else if (gamePhase === 'TRANSITION') {
            ctx.fillStyle = Math.random()<0.5 ? '#000' : '#220000'; ctx.fillRect(cam.x, cam.y, canvas.width, canvas.height); ctx.fillStyle = 'rgba(255,0,0,0.4)'; ctx.fillRect(cam.x, cam.y+Math.random()*canvas.height, canvas.width, Math.random()*20);
        } 
        else if (gamePhase === 'HORROR') {
            ctx.fillStyle = '#050202'; ctx.fillRect(viewRect.x, viewRect.y, viewRect.w, viewRect.h);
            visibleRooms.forEach(r => { ctx.fillStyle = '#0a0404'; ctx.fillRect(r.x, r.y, r.w, r.h); }); 
            
            visibleShards.forEach(s => { if (!s.active) return; ctx.fillStyle = `rgba(220, 255, 255, ${s.opacity})`; s.pieces.forEach(p => { ctx.save(); ctx.translate(s.x + p.ox, s.y + p.oy); ctx.rotate(p.angle); ctx.beginPath(); ctx.moveTo(0, -p.size); ctx.lineTo(p.size, p.size); ctx.lineTo(-p.size, p.size); ctx.fill(); ctx.restore(); }); });

            visibleBloods.forEach(bp => {
                bp.drags.forEach(dg => { ctx.save(); ctx.translate(dg.x, dg.y); ctx.rotate(dg.a); ctx.drawImage(preDragCanvas, 0, 0, 200, 40, 0, -dg.w/2, dg.len, dg.w); ctx.restore(); });
                ctx.save(); ctx.translate(bp.x, bp.y); ctx.scale(bp.radius/100, bp.radius/100); ctx.rotate(bp.rot); ctx.drawImage(preBloodCanvas, -100, -100, 200, 200); ctx.restore();
            });

            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            visibleDecals.forEach(d => {
                ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.angle);
                if (d.isEmoji) { ctx.font="30px Arial"; ctx.fillStyle="rgba(80,0,0,0.8)"; ctx.fillText("💀", 2, 2); ctx.fillStyle="rgba(200,0,0,0.9)"; ctx.fillText("💀", 0, 0); } 
                else { ctx.font="bold 26px '궁서', serif"; ctx.fillStyle="rgba(80,0,0,1)"; ctx.fillText(d.hText, 2, 2); ctx.fillStyle="rgba(150,0,0,0.9)"; ctx.fillText(d.hText, 0, 0); }
                ctx.restore();
            });
            
            if (keyRevealTimer > 0) {
                let targetX = escapeGate.x, targetY = escapeGate.y, minDist = Infinity;
                if (keysCollected < maxKeys && env.items.length > 0) { env.items.forEach(item => { let d = getDist(player, item); if(d < minDist) { minDist = d; targetX = item.x; targetY = item.y; } }); }
                let isExitReveal = (keysCollected >= maxKeys); ctx.save(); ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(targetX, targetY); ctx.strokeStyle = isExitReveal ? `rgba(50, 150, 255, ${Math.random()*0.5 + 0.3})` : `rgba(255, 50, 50, ${Math.random()*0.5 + 0.3})`; ctx.lineWidth = 3; ctx.setLineDash([15, 10]); ctx.lineDashOffset = -frameCount*2; ctx.stroke(); ctx.beginPath(); ctx.arc(targetX, targetY, 50 + Math.sin(frameCount*0.2)*15, 0, Math.PI*2); ctx.fillStyle = isExitReveal ? 'rgba(50, 150, 255, 0.4)' : 'rgba(255,0,0,0.4)'; ctx.fill(); ctx.restore();
            }
            
            visibleCandles.forEach(c => { ctx.fillStyle = 'rgba(255, 100, 50, 0.8)'; ctx.beginPath(); ctx.arc(c.x, c.y, 2, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = 'rgba(255, 200, 100, 0.5)'; ctx.beginPath(); ctx.arc(c.x, c.y, 1, 0, Math.PI*2); ctx.fill(); });

            visibleWalls.forEach(w => { ctx.fillStyle = 'rgba(0,0,0,0.95)'; ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.lineTo(w.x+w.w, w.y); ctx.lineTo(w.x+w.w+25, w.y+w.h+30); ctx.lineTo(w.x-15, w.y+w.h+30); ctx.fill(); });
            visibleWalls.forEach(w => draw3DWall(w, screenCX, screenCY, 'wall', 'side')); visibleDoors.forEach(d => draw3DWall(d, screenCX, screenCY, 'door', 'side')); visibleGens.forEach(g => draw3DWall(g, screenCX, screenCY, 'gen', 'side'));
            visibleWalls.forEach(w => draw3DWall(w, screenCX, screenCY, 'wall', 'top')); visibleDoors.forEach(d => draw3DWall(d, screenCX, screenCY, 'door', 'top')); visibleGens.forEach(g => draw3DWall(g, screenCX, screenCY, 'gen', 'top'));
            
            visibleShrines.forEach(s => { ctx.fillStyle = isShrineCooldown ? 'rgba(50,0,0,0.3)' : 'rgba(150,0,0,0.3)'; ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = isShrineCooldown ? '#330000' : '#800000'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(s.x, s.y, s.size*0.8, 0, Math.PI*2); ctx.stroke(); ctx.fillStyle = isShrineCooldown ? '#400' : '#d00'; ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, Math.PI*2); ctx.fill(); });
            if(inView(escapeGate)) { ctx.fillStyle = keysCollected >= maxKeys ? 'rgba(50,150,255,0.9)' : 'rgba(50,150,255,0.15)'; ctx.beginPath(); ctx.arc(escapeGate.x, escapeGate.y, escapeGate.radius, 0, Math.PI*2); ctx.fill(); }
            
            visibleItems.forEach(i => { ctx.save(); ctx.translate(i.x, i.y + Math.sin(frameCount*0.1)*3); ctx.rotate(Math.PI / 4); ctx.fillStyle = 'rgba(255,215,0,0.3)'; ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(-6, 0, 5, 0, Math.PI*2); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#B8860B'; ctx.stroke(); ctx.fillRect(-1, -2, 14, 4); ctx.fillRect(8, 2, 3, 4); ctx.fillRect(4, 2, 3, 3); ctx.restore(); });
            ctx.fillStyle = '#00ffcc'; visibleBatteries.forEach(b => { ctx.fillRect(b.x-6, b.y-8, 12, 16); ctx.fillStyle='#aaa'; ctx.fillRect(b.x-3, b.y-11, 6, 3); ctx.fillStyle='#00ffcc'; });

            if (monsterImg.complete && monsterImg.naturalWidth) { 
                let visualSize = monster.size * 4.5; 
                let mGlow = ctx.createRadialGradient(monster.x, monster.y, 0, monster.x, monster.y, visualSize/2);
                mGlow.addColorStop(0, 'rgba(255, 0, 0, 0.6)'); mGlow.addColorStop(1, 'rgba(255, 0, 0, 0)');
                ctx.fillStyle = mGlow; ctx.fillRect(monster.x - visualSize/2, monster.y - visualSize/2, visualSize, visualSize);
                ctx.globalAlpha = 0.95; ctx.drawImage(monsterImg, monster.x - visualSize/2, monster.y - visualSize/2, visualSize, visualSize); ctx.globalAlpha = 1.0;
            } else { ctx.fillStyle='darkred'; ctx.beginPath(); ctx.arc(monster.x, monster.y, monster.size, 0, Math.PI*2); ctx.fill(); }
            
            if (dashTimer > 0) { ctx.fillStyle = 'rgba(255, 255, 255, 0.3)'; ctx.beginPath(); ctx.arc(player.x - dashDir.x*20, player.y - dashDir.y*20, player.radius, 0, Math.PI*2); ctx.fill(); }
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fill(); 
        }
        ctx.restore(); 

        if (gamePhase === 'HORROR') {
            let vignette = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.height/3.5, canvas.width/2, canvas.height/2, canvas.height);
            vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,0,0,1.0)');
            
            maskCtx.clearRect(0, 0, canvas.width, canvas.height); 
            if (globalPowerTimer > 0) maskCtx.fillStyle = (Math.random() < 0.05) ? 'rgba(0,0,0,0.4)' : 'rgba(0,0,0,0.15)'; 
            else maskCtx.fillStyle = player.battery<=0 ? 'rgba(0,0,0,1.0)' : 'rgba(0,0,0,0.97)'; 
            
            maskCtx.fillRect(0, 0, canvas.width, canvas.height); maskCtx.globalCompositeOperation = 'destination-out';
            
            let px = player.x - cam.x; let py = player.y - cam.y + bobY;
            let g1 = maskCtx.createRadialGradient(px, py, 0, px, py, 150); 
            g1.addColorStop(0, 'rgba(255,255,255,1)'); g1.addColorStop(1, 'rgba(255,255,255,0)');
            maskCtx.fillStyle = g1; maskCtx.beginPath(); maskCtx.arc(px, py, 150, 0, Math.PI*2); maskCtx.fill();

            visibleCandles.forEach(c => {
                let cx = c.x - cam.x, cy = c.y - cam.y + bobY;
                let cGlow = maskCtx.createRadialGradient(cx, cy, 0, cx, cy, 80 + Math.random()*5);
                cGlow.addColorStop(0, 'rgba(255,150,50,0.8)'); cGlow.addColorStop(1, 'rgba(255,150,50,0)');
                maskCtx.fillStyle = cGlow; maskCtx.beginPath(); maskCtx.arc(cx, cy, 85, 0, Math.PI*2); maskCtx.fill();
            });

            if (player.isLightOn && player.battery > 0) {
                let fLen = 650 + Math.sin(frameCount*0.6)*20 + (Math.random()*10); 
                if (player.battery <= 20 || Math.random() < 0.05) fLen -= Math.random()*200;
                let a = Math.atan2(heavyMouse.y - py, heavyMouse.x - px);
                let g2 = maskCtx.createRadialGradient(px, py, 20, px, py, fLen); 
                g2.addColorStop(0, 'rgba(255,255,255,1)'); g2.addColorStop(0.5, 'rgba(255,255,255,0.85)'); g2.addColorStop(1, 'rgba(255,255,255,0)');
                maskCtx.fillStyle = g2; maskCtx.beginPath(); maskCtx.moveTo(px, py); maskCtx.arc(px, py, fLen, a-Math.PI/4.5, a+Math.PI/4.5); maskCtx.closePath(); maskCtx.fill();
            }
            maskCtx.globalCompositeOperation = 'source-over'; 
            
            ctx.save(); ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; dustParticles.forEach(d => { ctx.beginPath(); ctx.arc(d.x, d.y, d.size, 0, Math.PI*2); ctx.fill(); }); ctx.restore();
            ctx.drawImage(maskCanvas, 0, 0);

            ctx.fillStyle = vignette; ctx.fillRect(0, 0, canvas.width, canvas.height);

            let mDist = getDist(player, monster);
            if (mDist < 600) {
                let glitch = Math.min(1, (1-(mDist/600)) * (monster.enrage>0?1.0:0.7)); 
                ctx.fillStyle = `rgba(200, 200, 200, ${glitch * 0.05})`; let lineCount = Math.floor(10 * glitch); 
                for(let i=0; i<lineCount; i++) ctx.fillRect(0, Math.random()*canvas.height, canvas.width, Math.random()*2 + 1);
            }
            if (effects.redVignette > 0) { ctx.fillStyle = `rgba(150,0,0,${Math.min(0.4, effects.redVignette)})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
            if (effects.lightning > 0) { ctx.fillStyle = `rgba(200,220,255,${effects.lightning*0.3})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        }
    }

    function gameLoop() { if (gameActive) { update(); draw(); requestAnimationFrame(gameLoop); } }
</script>
